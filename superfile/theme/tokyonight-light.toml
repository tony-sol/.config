# This contains the theme config file for superfile! For more details
# @see https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "tokyonight-day"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#6172b0"
full_screen_bg = "#e1e2e7"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#2e7de9", "#9854f1"]
directory_icon_color = ""


#-- File Panel
file_panel_fg = "#6172b0"
file_panel_bg = "#e1e2e7"
file_panel_border = "#a1a6c5"
file_panel_border_active = "#b4befe"
file_panel_top_directory_icon = "#387068"
file_panel_top_path = "#2e7de9"
file_panel_item_selected_fg = "#188092"
file_panel_item_selected_bg = "#e1e2e7"

#-- Footer
footer_fg = "#6172b0"
footer_bg = "#e1e2e7"
footer_border = "#a1a6c5"
footer_border_active = "#387068"

#-- Sidebar
sidebar_fg = "#6172b0"
sidebar_bg = "#e1e2e7"
sidebar_title = "#387068"
sidebar_border = "#d0d5e3"
sidebar_border_active = "#f52a65"
sidebar_item_selected_fg = "#007197"
sidebar_item_selected_bg = "#e1e2e7"
sidebar_divider = "#848cb5"

#-- Modals
modal_fg = "#6172b0"
modal_bg = "#e1e2e7"
modal_border_active = "#387068"
modal_cancel_fg = "#c1c9df"
modal_cancel_bg = "#8c6c3e"
modal_confirm_fg = "#d0d5e3"
modal_confirm_bg = "#587539"

#-- Help Menu
help_menu_hotkey = "#007197"
help_menu_title = "#387068"

#-- Special
cursor = "#b15c00"
correct = "#587539"
error = "#f52a65"
hint = "#007197"
cancel = "#b15c00"
