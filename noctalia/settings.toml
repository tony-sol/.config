[bar.default]
capsule = true
capsule_thickness = 0.6
center = [
  "taskbar",
]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "sysmon",
  "network",
  "bluetooth",
  "volume",
  "keyboard_layout",
  "theme_mode",
  "session",
  "clock",
]
font_family = "JetBrainsMono NF"
padding = 24
thickness = 42
widget_spacing = 8

[control_center]
width = 1200

[idle]
behavior_order = [
  "lock",
  "screen-off",
  "lock-and-suspend",
]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = false
timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 196.0
box_width = 810.0
cx = 1536.0
cy = 1546.0
output = "DP-2"
placement_height = 1728.0
placement_width = 3072.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 1
width = 420

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true
settings_expand_all_groups = true

[shell.screenshot]
show_cursor = true

[theme]
builtin = "Noctalia"
community_palette = "Tokyo Night Moon"
mode = "dark"
source = "community"
wallpaper_scheme = "soft"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.clock]
capsule_opacity = 0.98
capsule_padding = 5
timezone = "Europe/Moscow"
tooltip_format = "{:%A, %d %B %Y}"

[widget.keyboard_layout]
capsule_border_width = 0.0
capsule_padding = 5
show_glyph = false

[widget.taskbar]
item_spacing = 8
show_all_outputs = true
show_window_title = true
window_title_max_width = 200
workspace_group_capsule = false

[widget.workspaces]
show_all_outputs = true
style = "focus_hint"
